<style>
:root{
  --ink:#000; --paper:#fff; --signal:#FF3B1F; --muted:#6B6B6B; --rule:1.5px;
  --g:clamp(20px,3.2vw,48px);
  --display:'Funnel Display', system-ui, -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --text:'Funnel Sans', system-ui, -apple-system, sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.55 var(--mono);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:0}
h1,p,figure{margin:0}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
::selection{background:var(--signal);color:var(--ink)}

/* page: one screen, everything centred */
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:0 var(--g)}
header{width:100%;display:flex;justify-content:center;padding:clamp(24px,4vh,40px) 0 0}
.brand{display:flex;align-items:center;gap:12px}
.nh-hd{height:30px;width:auto;fill:var(--ink);overflow:visible}
.brand{padding:12px;margin:-12px}
.nh-hd rect{shape-rendering:crispEdges}
.nh-hd .nh-r{fill:#FF3B1F;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
@media (hover:hover){.brand:hover .nh-hd .nh-r{transform:translateY(-27px)}}
main{flex:1;width:100%;max-width:880px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(8px,2vh,24px) 0 clamp(32px,6vh,64px)}

/* the plan (same as the landing) */
.iso{position:relative;height:clamp(420px,min(48vw,calc(100vh - 150px)),760px);--sw:4;animation:isoIn .8s cubic-bezier(.2,.7,.2,1) .05s backwards}
.iso-scene{--rx:56deg;--rz:-45deg;position:absolute;left:53.5%;top:50%;width:84%;aspect-ratio:2000/1299;
  transform-style:preserve-3d;transform:translate(-50%,-34%) rotateX(var(--rx)) rotateZ(var(--rz))}
@keyframes isoIn{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){.iso{animation:none}}
.no-js .iso-scene{opacity:1}

.iso-layer{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
/* the plate itself: it slides on hover, while .iso-layer (the hit area) stays put, so hover never flickers */
.iso-in{--hv:0;--dm:0;position:absolute;inset:0;background:rgba(255,255,255,calc((.8 + .2 * var(--hv)) * (1 - var(--dm))));box-sizing:border-box;border:1.5px solid rgba(0,0,0,calc((1 - .8 * var(--dm)) * (1 - var(--up,0))));backface-visibility:hidden;pointer-events:none;will-change:transform,opacity}
.iso-layer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.iso-ui .iso-in{background:rgba(255,255,255,calc(1 - var(--dm)))}
/* on hover, the other layers keep only their outline */
.iso-in > :not(.iso-a){opacity:calc(1 - var(--dm))}
.iso-in.dim{border-style:dashed;border-color:rgba(0,0,0,calc((1 - .68 * var(--dm)) * (1 - var(--up,0))))}
.iso-ui img{position:absolute;inset:0;width:100%;height:100%;display:block}
.no-js .iso-layer{transform:translateZ(calc(var(--i) * 44px))}
.iso-a{position:absolute;left:0;top:0;width:1px;height:1px}
.iso-b{top:100%}
.iso-tags{position:absolute;inset:0;pointer-events:none;z-index:3}
/* the hovered layer's label: a small badge hanging under the plate's front corner, never near the title */
.iso-tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--ink);color:var(--paper);font:500 11px/1 var(--mono);letter-spacing:.08em;white-space:nowrap;opacity:0;will-change:transform,opacity;pointer-events:none}
.iso-tag em{font-style:normal}
.iso-tag b{font-weight:700;color:var(--signal)}
.iso-tag i{position:absolute;left:50%;bottom:100%;width:1.5px;height:16px;margin-left:-.75px;background:var(--ink)}
.no-js .iso-tags{display:none}
.iso-layer{pointer-events:auto}
@media (hover:none){.iso-tag{pointer-events:none}}
.iso-axis{position:absolute;width:0;height:var(--axis,0px);border-left:1.5px dashed rgba(0,0,0,.32);transform-origin:0 0;transform:rotateX(90deg)}
.iso .gcol{fill:var(--signal);opacity:.10}
.iso .gbl{stroke:var(--signal);stroke-width:calc(var(--sw) * .6);opacity:.35}
.iso .ln{fill:none;stroke:var(--ink);stroke-width:var(--sw)}
.iso .tb{fill:#CFCFCB}
.iso .acc{fill:var(--signal)}
.iso .fab{fill:var(--ink)}
.iso .gl{stroke:#BDBDB9;stroke-width:var(--sw);stroke-dasharray:8 10}
.iso .area{fill:var(--signal);opacity:.12}
.iso .dl{fill:none;stroke:var(--signal);stroke-width:calc(var(--sw) * 1.6);stroke-linejoin:round}
.iso .pt{fill:#fff;stroke:var(--signal);stroke-width:var(--sw)}
.iso .db{fill:var(--signal)}
.iso{width:100%;height:clamp(230px,42vh,440px);margin-top:clamp(20px,4.5vh,48px)}
.iso-scene{left:50%;top:50%;width:min(60%,calc(42vh * .9),400px)}
@media (max-width:700px){.iso{height:clamp(210px,62vw,320px)}.iso-scene{width:68%;top:44%}.iso-tags{display:none}}

.cs-h{margin-top:clamp(8px,2vh,24px);font:800 clamp(42px,6vw,84px)/.88 var(--display);letter-spacing:-.05em;text-transform:uppercase;text-wrap:balance}
.dot{display:inline-block;width:.17em;height:.17em;margin-left:.05em;background:var(--signal);overflow:hidden;text-indent:-9em;vertical-align:baseline}
.cs-lead{margin-top:clamp(16px,2.6vh,28px);max-width:34ch;font:400 clamp(18px,1.6vw,22px)/1.4 var(--text);letter-spacing:-.01em;color:#1A1A1A;text-wrap:pretty}
.cs-mail{margin-top:clamp(24px,4vh,40px);display:inline-flex;align-items:center;gap:14px;height:52px;padding:0 22px;background:var(--ink);color:var(--paper);font:700 13px/1 var(--mono);letter-spacing:.04em;transition:background-color .15s,color .15s}
.cs-mail:hover{background:var(--signal);color:var(--ink)}
.cs-mail svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.cs-mail{min-width:228px;justify-content:center;padding:0 16px;gap:10px}
.cs-mail .i-ok,.cs-mail .i-copy{display:none}
.cs-mail.mail .i-copy{display:block}
.cs-mail.done .i-copy{display:none}
#copy-txt{display:inline-block}
#copy-txt.swap{animation:csSwap .35s cubic-bezier(.2,.7,.2,1)}
@keyframes csSwap{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:none}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cs-mail .i-ok{display:none}
.cs-mail.done{background:var(--signal);color:var(--ink)}
.cs-mail.done .i-ok{display:block}
.cs-note{margin-top:12px;min-height:1.4em;font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
footer{width:100%;display:flex;justify-content:center;padding:0 0 clamp(20px,3vh,32px);font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* entrance */
.js .rv{opacity:0;transform:translateY(12px)}
.ready .rv{opacity:1;transform:none;transition:opacity .7s,transform .9s var(--ease);transition-delay:calc(.15s + var(--d,0) * .1s)}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none}.ready .rv{transition:none}}
@media (max-width:560px){.cs-mail{width:100%;justify-content:center}}
@media (max-height:820px) and (min-width:701px){.iso{height:37vh;margin-top:3vh}.iso-scene{width:min(60%,calc(37vh * .9),400px)}.cs-lead{margin-top:14px}.cs-mail{margin-top:22px}}

/* ---- hero preview: the new plan ---- */
.pl{position:relative;height:clamp(420px,min(48vw,calc(100vh - 150px)),760px);--sw:4;--ps:1;--ts:1}
.pl-scene{--ps:1;position:absolute;left:50%;top:50%;width:min(115%,880px);aspect-ratio:2000/1299;transform-style:preserve-3d}
.pl-layer{--dm:0;position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.pl .sd{--el:calc(1.25px * var(--ps)) solid #111;position:absolute;box-sizing:border-box;transform-origin:0 0;opacity:calc(1 - var(--dm))}
.pl .s-t{left:0;top:0;width:100%;height:var(--th,12px);transform:rotateX(-90deg);background:#ececea;border-left:var(--el);border-right:var(--el)}
.pl .s-k{inset:0;transform:translateZ(calc(-1 * var(--th,12px) - .5px));outline:var(--el);outline-offset:0}
.pl .s-r{left:100%;top:0;width:var(--th,12px);height:100%;transform:rotateY(90deg);background:#d8d8d4;border-bottom:var(--el)}
.pl .shd{position:absolute;inset:2% 1%;background:rgba(0,0,0,.13);filter:blur(26px);transform:translateZ(calc(-1 * var(--th,12px) - 2px));opacity:var(--shd,0)}
.pl-in{--sel:0;--ed:0;--tg:0;position:absolute;inset:0;background:rgba(255,255,255,calc(1 - var(--dm)))}
.pl-in::after{content:"";position:absolute;inset:0;border:calc(1.25px * var(--ps)) solid rgba(17,17,17,calc(1 - .72 * var(--dm)));pointer-events:none}
.pl-in > svg,.pl-in > img{opacity:calc(1 - var(--k,.85) * var(--dm))}
.pl-in.dim::after{border-style:dashed}
.pl-layer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pl-ui img{position:absolute;inset:0;width:100%;height:100%;display:block}
.pl-a{position:absolute;width:1px;height:1px}
.pl .c0{left:0;top:0}
.pl .c1{left:100%;top:0}
.pl .c2{left:100%;top:100%}
.pl .c3{left:0;top:100%}
.pl .hd{position:absolute;width:calc(10px * var(--ps));height:calc(10px * var(--ps));margin:calc(-5px * var(--ps)) 0 0 calc(-5px * var(--ps));background:var(--paper);border:calc(1.5px * var(--ps)) solid var(--signal);opacity:var(--sel)}
.pl .tags{position:absolute;inset:0;pointer-events:none;z-index:3}
.pl .ptag{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;align-items:center;gap:calc(8px * var(--ts));padding:calc(6px * var(--ts)) calc(10px * var(--ts)) calc(6px * var(--ts)) calc(8px * var(--ts));background:var(--paper);outline:calc(1px * var(--ps)) solid #1c1c1c;font:500 calc(12px * var(--ts))/1 var(--mono);letter-spacing:.01em;color:var(--ink);white-space:nowrap;opacity:var(--tg,0)}
.pl .ptag i{width:calc(9px * var(--ts));height:calc(9px * var(--ts));box-shadow:inset 0 0 0 calc(1px * var(--ps)) currentColor;flex:none}
.pl .ptag.on i{background:var(--signal);box-shadow:none}
.pl .gcol{fill:var(--signal);opacity:.10}
.pl .gbl{stroke:var(--signal);stroke-width:calc(var(--sw) * .6);opacity:.35}
.pl .ln{fill:none;stroke:var(--ink);stroke-width:var(--sw)}
.pl .tb{fill:#CFCFCB}
.pl .sel0{fill:#EDEDEA}
.pl .acc{fill:var(--signal)}
.pl .fab{fill:var(--ink)}
.pl .gl{stroke:#BDBDB9;stroke-width:var(--sw);stroke-dasharray:8 10}
.pl .area{fill:var(--signal);opacity:calc(.12 * (1 - var(--ed)))}
.pl .dl{fill:none;stroke:var(--signal);stroke-width:calc(var(--sw) * 1.6);stroke-linejoin:round;opacity:calc(1 - var(--ed))}
.pl .pt{fill:#fff;stroke:var(--signal);stroke-width:var(--sw);opacity:calc(1 - var(--ed))}
.pl .db{fill:var(--signal);opacity:calc(1 - .75 * var(--ed))}
.pl .ed{opacity:var(--ed)}
.pl .ed .o{fill:none;stroke:var(--ink);stroke-width:var(--sw);stroke-linejoin:miter}
.pl .ed .bx{fill:none;stroke:var(--signal);stroke-width:calc(var(--sw) * .9)}
.pl .ed .bh{fill:#fff;stroke:var(--signal);stroke-width:calc(var(--sw) * .9)}
.pl .ed .eph{fill:#fff;stroke:var(--ink);stroke-width:calc(var(--sw) * .9)}
@media (max-width:900px){.pl{height:clamp(300px,82vw,520px)}.pl .pl-scene{width:88%}}
.pl .hd{display:none}   /* no orange corner squares on hover */
/* layers that are not hovered: nothing inside, no sides, just a dashed outline */
.pl-in{background:rgba(255,255,255,calc(1 - var(--dm)))}
/* solid edge fades out while a dashed edge fades in: no hard switch between the two styles */
.pl-in::after,.pl-in.dim::after{border-style:solid !important;border-color:rgba(17,17,17,calc(1 - var(--dm))) !important}
.pl-in{outline:calc(1.25px * var(--ps)) dashed rgba(17,17,17,calc(.42 * var(--dm)));outline-offset:calc(-1.25px * var(--ps))}
.pl .sd{opacity:calc(1 - var(--dm))}
.pl .shd{opacity:calc(var(--shd,0) * (1 - var(--dm)))}

/* coming soon: the plan sits on top, the title and the contact button under it */
.pl{width:100%;height:clamp(240px,44vh,460px);margin-top:clamp(16px,4vh,44px)}
.pl .pl-scene{width:min(64%,540px,60vh)}
.pl .ptag{text-align:left}
@media (max-width:700px){.pl{height:clamp(240px,74vw,340px);margin-top:clamp(12px,3vh,28px)}.pl .pl-scene{width:86%}}

</style>
</head>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const hasIO = 'IntersectionObserver' in window;
  requestAnimationFrame(() => document.documentElement.classList.add('ready'));

  /* ---------- hero: exploded isometric view ---------- */
  // intro: the layers lift off one by one. Hover a layer (or its label): it slides left, the others step back, its note appears.
  const iso = $('.iso');
  if (iso) {
    const scene = $('.iso-scene', iso);
    const layers = $$('.iso-layer', scene), plates = layers.map(l => $('.iso-in', l)), anchors = layers.map(l => $('.iso-b', l));
    const tags = $$('.iso-tag', iso);
    const N = layers.length;
    const clamp = v => Math.max(0, Math.min(1, v));
    const outCubic = t => 1 - Math.pow(1 - t, 3);
    const inOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // slow start, slow end
    let p = reduce ? 1 : 0;                    // intro progress 0 → 1
    let raf = 0, introOn = false, t0 = 0, hov = -1, last = 0, hovT = 0, want = -1, ref = -1;
    const h = layers.map(() => 0);             // per-layer hover amount, eased
    let floatT = performance.now() / 1000;   // the float clock pauses while a plate is out, so the hit areas hold still under the pointer
    const g = layers.map(() => 0);             // per-layer dimming, eased: 1 = this plate steps back because another one is out
    const INTRO = 2100, STAGGER = 0.1, FLOAT = !reduce;
    const sizes = () => iso.style.setProperty('--sw', (1.3 * 2000 / (scene.offsetWidth || 1)).toFixed(2));
    const render = () => {
      const r = iso.getBoundingClientRect();
      const fold = clamp((innerHeight * 0.15 - r.top) / (r.height * 0.9));   // close the stack as it scrolls away
      const W = scene.offsetWidth, G = W * 0.1 * (1 - 0.85 * fold), D = W * 0.1;   // D: how far the hovered plate slides out
      let top = 0;
      layers.forEach((l, i) => {
        // top layers lift off first, so the stack never crosses itself; 1px floor avoids z-fighting
        const e = inOut(clamp((p - (N - 1 - i) * STAGGER) / (1 - (N - 1) * STAGGER)));
        // levitate: once the stack is open, every layer drifts a few pixels, out of phase with its neighbours
        const lev = FLOAT ? Math.sin(floatT * 1.15 + i * 1.1) * W * 0.013 * e : 0;
        const z = i * (1 + (G - 1) * e) + lev;
        if (i === N - 1) top = z;
        l.style.transform = `translate3d(0,0,${z.toFixed(2)}px)`;
        // local (-k,-k) is straight left on screen in this projection
        const k = -0.7071 * D * h[i];   // starts moving at once, then settles (ease-out)
        plates[i].style.transform = `translate3d(${k.toFixed(2)}px,${k.toFixed(2)}px,0)`;
        // the others step back: grey and faint, so only the hovered plate reads
        const d = g[i];   // its own target, so switching plates never flashes the others back
        plates[i].style.setProperty('--dm', d.toFixed(3));
        plates[i].classList.toggle('dim', d > 0.5);   // dashed only once it has mostly faded, so the switch never pops
        plates[i].style.setProperty('--hv', h[i].toFixed(3));
        tags[i].dataset.e = e;
      });
      scene.style.setProperty('--axis', top.toFixed(2) + 'px');
      // flat labels, hanging under each plate's front corner
      tags.forEach((t, i) => {
        const a = anchors[i].getBoundingClientRect();
        const x = a.left - r.left, y = a.top - r.top;
        const e = +t.dataset.e;
        // only the hovered layer shows its label
        t.style.opacity = (clamp((e - 0.6) / 0.4) * (1 - clamp((fold - 0.35) / 0.3)) * outCubic(h[i])).toFixed(3);
        t.style.transform = `translate3d(${(x - t.offsetWidth / 2).toFixed(1)}px,${(y + 16).toFixed(1)}px,0)`;
      });
    };
    const tick = now => {
      raf = 0;
      if (introOn) { p = clamp((now - t0) / INTRO); if (p >= 1) introOn = false; }
      let moving = false;
      const dt = last ? Math.min(64, now - last) : 16; last = now;
      if (hov === -1) floatT += dt / 1000;
      const f = 1 - Math.exp(-dt / 90);   // time-based easing: ~0.5 s to settle, same on every screen
      h.forEach((v, i) => { const t = i === hov ? 1 : 0; h[i] = v + (t - v) * f; if (Math.abs(t - h[i]) < 0.002) h[i] = t; else moving = true; });
      const fd = 1 - Math.exp(-dt / 60);   // the others step back faster than the plate moves
      g.forEach((v, i) => { const t = hov >= 0 && i !== hov ? 1 : 0; g[i] = v + (t - v) * fd; if (Math.abs(t - g[i]) < 0.002) g[i] = t; else moving = true; });
      render();
      if (introOn || moving || FLOAT) raf = requestAnimationFrame(tick); else last = 0;
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };
    // a short delay before switching, so crossing from one plate to the next never flickers
    const setHov = i => {
      if (i === want) return;                  // pointermove fires constantly: only a change of plate restarts the timer
      want = i; clearTimeout(hovT);
      if (i !== -1) applyHov(i);                // a plate: respond at once
      else hovT = setTimeout(() => applyHov(-1), 90);   // leaving: a beat, so crossing a gap between plates never flickers
    };
    const applyHov = i => {
      if (p < 1) { want = -2; return; }        // wait for the intro to finish (and let the next move try again)
      if (i === hov) return;
      hov = i; if (i >= 0) ref = i;
      tags.forEach((t, k) => t.classList.toggle('on', k === i));
      kick();
    };
    sizes(); render();
    if ('ResizeObserver' in window) new ResizeObserver(() => { sizes(); kick(); }).observe(iso);
    addEventListener('scroll', kick, { passive: true });
    const go = () => {
      iso.classList.add('on');
      if (reduce) { p = 1; render(); return; }
      t0 = performance.now(); introOn = true; kick();
    };
    // the title finishes at ~0.6 s: the plan starts just before, so the two overlap
    const start = go;
    if (fine) {
      iso.addEventListener('pointermove', e => {
        const el = e.target.closest('.iso-layer');
        setHov(el ? layers.indexOf(el) : -1);
      });
      iso.addEventListener('pointerleave', () => setHov(-1));
    }
    if (hasIO) {
      let started = false;
      new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting && !started) { started = true; start(); } }), { threshold: 0.2 }).observe(iso);
    } else start();
  }


  /* "Contact me": hovering shows the address, a click copies it (no clipboard → the mail app opens) */
  const btn = $('#copy'), txt = $('#copy-txt'), status = $('#copy-status');
  if (btn) {
    const mail = btn.dataset.email, BASE = 'CONTACT ME';
    let state = 'base', tm = 0;
    const show = (t, st) => {
      if (state === st) return;
      state = st; txt.textContent = t;
      btn.classList.toggle('mail', st === 'mail');
      txt.classList.remove('swap'); void txt.offsetWidth; txt.classList.add('swap');
    };
    const legacy = v => { const a = document.createElement('textarea'); a.value = v; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} a.remove(); return ok; };
    btn.addEventListener('mouseenter', () => { if (state !== 'ok') show(mail, 'mail'); });
    btn.addEventListener('focus', () => { if (state !== 'ok') show(mail, 'mail'); });
    btn.addEventListener('mouseleave', () => { if (state !== 'ok') show(BASE, 'base'); });
    btn.addEventListener('blur', () => { if (state !== 'ok') show(BASE, 'base'); });
    btn.addEventListener('click', async () => {
      let ok = false;
      try { await navigator.clipboard.writeText(mail); ok = true; } catch (_) { ok = legacy(mail); }
      if (!ok) { location.href = 'mailto:' + mail; return; }
      btn.classList.add('done'); show('COPIED TO CLIPBOARD', 'ok'); status.textContent = 'Email copied: ' + mail;
      clearTimeout(tm);
      tm = setTimeout(() => { btn.classList.remove('done'); state = ''; const h = btn.matches(':hover'); show(h ? mail : BASE, h ? 'mail' : 'base'); }, 1800);
    });
  }
})();

<script>

(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const layers = $$('.pl-layer', scene), plates = layers.map(l => $('.pl-in', l));
  const corners = plates.map(p => $$('.pl-a', p)), ptags = $$('.ptag');
  const N = layers.length, DATA = 2, REST = 1800;
  const clamp = v => Math.max(0, Math.min(1, v));

  // camera: from above and a little to the left, so the layers fan out on a diagonal, back top-right, front bottom-left.
  // Orthographic: parallel edges stay parallel.
  const CAM = { rx: -18, ry: -18, rz: -2, s: .74, g: .2, tx: 0, ty: -.01 };

  // the story, in ms: flat → turn → layers lift → name them (→ in a loop, fold back)
  const story = t => {
    const ph = innerWidth < 900;
    const open = clamp((t - (ph ? 120 : 450)) / 900), close = clamp((t - 4200) / 900);   // the camera turns first, then the layers lift
    const p = open * (1 - close);
    const cam = (ph ? 1 : inOut(clamp((t - 100) / 650))) * (1 - inOut(clamp((t - 4900) / 650)));
    const tag = layers.map((_, i) => {
      const a = (ph ? 820 : 1150) + (N - 1 - i) * 90;           // back layer first, like a list being read
      const d = loop ? 4000 + i * 40 : Infinity;   // the names stay; in a loop they leave just before the stack folds
      return outBack(clamp((t - a) / 280)) * (1 - inOut(clamp((t - d) / 220)));
    });
    const sel = 0;
    return { p, cam, tag, sel };
  };

  const q = new URLSearchParams(location.search);
  let loop = q.get('loop') === '1', t = 0, last = 0, playing = true, frozen = false, floatT = 0;
  if (reduce) { t = REST; playing = false; }
  if (q.has('t')) { t = +q.get('t'); playing = false; frozen = true; }
  const hs = layers.map(() => 0), hv = layers.map(() => 0), ds = layers.map(() => 0), vis = layers.map(() => 1), tagC = layers.map(() => 0); let hov = -1, hovRest = null;   // hover, once the story is over

  // the scene's natural width comes from the CSS; the zoom then sets its real width each frame
  let baseW = 820, curW = 0;
  const sizes = () => {
    scene.style.width = ''; baseW = scene.offsetWidth || 820; curW = 0;
    iso.style.setProperty('--ts', innerWidth < 700 ? .66 : 1);
  };
  let armed = innerWidth >= 900 || reduce || !('IntersectionObserver' in window);
  if (!armed) { const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { armed = true; io.disconnect(); } }, { threshold: .5 }); io.observe(iso); }
  const canHover = () => !loop && t >= REST;
  // scrolling down packs the layers back together, smoothly, as the hero leaves the screen
  const hero = iso.closest('section') || iso; let scr = 0;
  const narrow = () => innerWidth < 900;
  // desktop: from the first scroll, over the hero. Phone: only once the plan is well in view (its top above 22% of the screen)
  const scrollT = () => reduce ? 0 : narrow()
    ? (r => clamp((innerHeight * .22 - r.top) / Math.max(1, r.height * 1.1)))(iso.getBoundingClientRect())
    : clamp(scrollY / Math.max(1, hero.offsetHeight * .8));

  const render = () => {
    const rest = canHover();
    const s = rest ? { p: 1, cam: 1, tag: layers.map(() => 0), sel: 0 } : story(t);
    const C = window.CAM || CAM;
    const u = s.cam;
    const FLAT = innerWidth < 900 ? .96 : .86;
    const sc = lerp(FLAT, .92, u) * lerp(1, C.s / .92, inOut(s.p));   // zoom out only as the layers spread
    // while it moves, the zoom is a plain GPU scale of a scene laid out at its largest size (smooth, never upscaled);
    // once it holds still, the scene is laid out at its shown size and the scale drops to 1, so the screenshot is painted sharp
    const settled = s.p >= 1 && u >= 1;
    const lay = settled ? sc : FLAT, k = sc / lay;
    const wPx = baseW * lay;
    scene.style.setProperty('--ps', (1 / k).toFixed(4));
    if (Math.abs(wPx - curW) > .15) {
      curW = wPx; scene.style.width = wPx.toFixed(2) + 'px';
      iso.style.setProperty('--sw', (1.3 * 2000 / wPx).toFixed(3));
      scene.style.setProperty('--th', (wPx * .034).toFixed(2) + 'px');   // thick slabs
    }
    const W = curW, H = W * 1299 / 2000, G = W * C.g * (innerWidth < 900 ? 2.1 : 1), Wv = baseW * sc, Hv = Wv * 1299 / 2000;
    const eTop = inOut(clamp(s.p / (1 - (N - 1) * STAG)));
    const gz = 1 - (innerWidth < 900 ? .4 : .82) * scr;   // phones: the layers only draw a little closer   // 1 = fanned out, close to 0 = packed
    const midZ = (N - 1) * (1 + (G - 1) * eTop * gz) / 2;   // the middle of the stack stays on the camera axis
    // levitation: the stack drifts as one, slowly, and a soft wave runs up through the layers,
    // each one a beat behind the one below, so they breathe apart and back without ever jittering
    const fy = Math.sin(floatT * .7) * Hv * .0115 * eTop;
    scene.style.transform = `translate(-50%,-50%) translate(${(Wv * C.tx * u).toFixed(2)}px,${(Hv * C.ty * u + fy).toFixed(2)}px) rotateX(${(C.rx * u).toFixed(3)}deg) rotateY(${(C.ry * u).toFixed(3)}deg) rotateZ(${(C.rz * u).toFixed(3)}deg) scale3d(${k.toFixed(4)},${k.toFixed(4)},${k.toFixed(4)}) translateZ(${(-midZ).toFixed(2)}px)`;
    const sel = layers.map((_, i) => Math.max(i === DATA ? s.sel : 0, ds[i]));
    layers.forEach((l, i) => {
      const e = inOut(clamp((s.p - (N - 1 - i) * STAG) / (1 - (N - 1) * STAG)));
      const lev = Math.sin(floatT * 1.05 - i * .5) * W * .016 * e;
      // the hovered layer slides out of the stack, along its own plane, and lifts a little
      l.style.transform = `translate3d(${(-hs[i] * W * .055).toFixed(2)}px,${(-hs[i] * H * .02).toFixed(2)}px,${(i * (1 + (G - 1) * e * gz) + lev * gz + hs[i] * G * .06).toFixed(2)}px)`;
      const dm = 1 - vis[i];
      l.style.setProperty('--dm', dm.toFixed(3));
      const pl = plates[i];
      pl.style.setProperty('--k', 1);   // the other layers empty out: only their dashed edges stay
      pl.style.setProperty('--sel', hs[i].toFixed(3));
      pl.classList.toggle('dim', dm > .5);
      const c = clamp(rest ? 1 : s.tag[i]);
      ptags[i].style.setProperty('--tg', (c * (1 - .75 * dm)).toFixed(3));
      ptags[i].classList.toggle('on', sel[i] > .5);
      tagC[i] = c;
    });
    // each tab takes its plate's skew: the plate's own axes, measured on screen
    const r = iso.getBoundingClientRect(), PW = scene.offsetWidth, PH = scene.offsetHeight;
    ptags.forEach((g, i) => {
      if (tagC[i] <= 0) return;
      const [a, b, , d] = corners[i].map(c => c.getBoundingClientRect());
      const ux = (b.left - a.left) / PW, uy = (b.top - a.top) / PW, vx = (d.left - a.left) / PH, vy = (d.top - a.top) / PH;
      const lift = (1 - tagC[i]) * 8;
      g.style.transform = `matrix(${ux.toFixed(5)},${uy.toFixed(5)},${vx.toFixed(5)},${vy.toFixed(5)},${(a.left - r.left).toFixed(2)},${(a.top - r.top).toFixed(2)}) translate(0, calc(-100% - 8px + ${lift.toFixed(2)}px))`;
    });
    scene.style.setProperty('--shd', (u * (1 - Math.max(...sel))).toFixed(3));
    (document.querySelector('.bar i')||{style:{}}).style.width = (loop ? (t % LOOP_MS) / LOOP_MS * 100 : clamp(t / REST) * 100).toFixed(2) + '%';
  };

  const tick = now => {
    const dt = last ? Math.min(64, now - last) : 16; last = now;
    if (playing && armed) { t += dt; if (loop && t >= LOOP_MS) t = 0; if (!loop && t >= REST) { t = REST; playing = false; } }
    // the float eases to a stop while a plate is hovered, and picks up again from where it was
    fs += ((hov === -1 ? 1 : 0) - fs) * (1 - Math.exp(-dt / 250));
    scr += (scrollT() - scr) * (1 - Math.exp(-dt / 140));
    if (!frozen && !reduce) floatT += fs * dt / 1000;
    const sdt = dt / 1000, w = 10;
    hs.forEach((v, i) => {
      const g = i === hov ? 1 : 0;
      hv[i] += (w * w * (g - v) - 2 * w * hv[i]) * sdt; hs[i] = v + hv[i] * sdt;
      if (Math.abs(g - hs[i]) < .001 && Math.abs(hv[i]) < .002) { hs[i] = g; hv[i] = 0; }
      const k = 1 - Math.exp(-dt / (g ? 45 : 90));   // out in ~0.15 s, back in ~0.3 s
      ds[i] = Math.abs(g - ds[i]) < .003 ? g : ds[i] + (g - ds[i]) * k;
      // each layer fades on its own: the hovered one is shown straight away, the others go, all at the same pace
      const tv = (hov === -1 || i === hov) ? 1 : 0, kv = 1 - Math.exp(-dt / 55);
      vis[i] = Math.abs(tv - vis[i]) < .003 ? tv : vis[i] + (tv - vis[i]) * kv;
    });
    render();
    requestAnimationFrame(tick);
  };
  let fs = 1;

  // hover: hit-test the plates' outlines on screen (front first), not the DOM, so a faded plate in front never steals the pointer.
  // A little hysteresis: leaving the current plate for the one in front needs a few px inside it, so the edges never flicker.
  const quad = i => corners[i].map(c => { const b = c.getBoundingClientRect(); return [b.left, b.top]; });
  const depth = (qd, x, y) => {     // smallest distance to the edges, negative when outside
    let m = Infinity, sg = 0;
    for (let k = 0; k < 4; k++) {
      const [x1, y1] = qd[k], [x2, y2] = qd[(k + 1) % 4];
      const len = Math.hypot(x2 - x1, y2 - y1) || 1;
      const d = ((x2 - x1) * (y - y1) - (y2 - y1) * (x - x1)) / len;
      if (!sg) sg = Math.sign(d) || 1;
      m = Math.min(m, d * sg);
    }
    return m;
  };
  let leaveT = 0;
  const pick = (x, y) => {
    let hit = -1;
    // the hovered layer counts where it was before it slid (hovRest) as well as where it is now
    const inside = i => i === hov && hovRest ? Math.max(depth(hovRest, x, y), depth(quad(i), x, y)) : depth(quad(i), x, y);
    for (let i = N - 1; i >= 0; i--) if (inside(i) > 0) { hit = i; break; }
    if (hov >= 0 && hit > hov && inside(hov) > 0 && depth(quad(hit), x, y) < 10) hit = hov;   // a front layer must be clearly entered
    return hit;
  };
  iso.addEventListener('pointermove', e => {
    if (!canHover() || e.pointerType === 'touch') return;
    const hit = pick(e.clientX, e.clientY);
    clearTimeout(leaveT);
    if (hit >= 0) { if (hit !== hov) hovRest = quad(hit); hov = hit; }
    else if (hov >= 0) leaveT = setTimeout(() => { hov = -1; }, 420);
  });
  iso.addEventListener('pointerleave', () => { clearTimeout(leaveT); leaveT = setTimeout(() => { hov = -1; }, 140); });

  loop = false;
  sizes(); addEventListener('resize', () => { sizes(); if (frozen) render(); });
  window.__seek = ms => { t = ms; playing = false; frozen = true; render(); };
  window.__hover = i => { hov = i; hs.forEach((_, k) => hs[k] = k === i ? 1 : 0); render(); };
  if (frozen) render(); else requestAnimationFrame(tick);
})();

</script>
