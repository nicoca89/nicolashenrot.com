<style>
:root{
  --ink:#000; --paper:#fff; --signal:#FF3B1F; --muted:#6B6B6B; --rule:1.5px;
  --g:clamp(20px,3.2vw,48px);
  --display:'Funnel Display', system-ui, -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --text:'Funnel Sans', system-ui, -apple-system, sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.55 var(--mono);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:0}
h1,p,figure{margin:0}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
::selection{background:var(--signal);color:var(--ink)}

/* page: one screen, everything centred */
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:0 var(--g)}
header{width:100%;display:flex;justify-content:center;padding:clamp(24px,4vh,40px) 0 0}
.brand{display:flex;align-items:center;gap:12px}
.nh-hd{height:30px;width:auto;fill:var(--ink);overflow:visible}
.brand{padding:12px;margin:-12px}
.nh-hd rect{shape-rendering:crispEdges}
.nh-hd .nh-r{fill:#FF3B1F;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
@media (hover:hover){.brand:hover .nh-hd .nh-r{transform:translateY(-27px)}}
main{flex:1;width:100%;max-width:880px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(8px,2vh,24px) 0 clamp(32px,6vh,64px)}

/* the plan (same as the landing) */
.iso{position:relative;height:clamp(420px,min(48vw,calc(100vh - 150px)),760px);--sw:4;animation:isoIn .8s cubic-bezier(.2,.7,.2,1) .05s backwards}
.iso-scene{--rx:56deg;--rz:-45deg;position:absolute;left:53.5%;top:50%;width:84%;aspect-ratio:2000/1299;
  transform-style:preserve-3d;transform:translate(-50%,-34%) rotateX(var(--rx)) rotateZ(var(--rz))}
@keyframes isoIn{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){.iso{animation:none}}
.no-js .iso-scene{opacity:1}

.iso-layer{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
/* the plate itself: it slides on hover, while .iso-layer (the hit area) stays put, so hover never flickers */
.iso-in{--hv:0;--dm:0;position:absolute;inset:0;background:rgba(255,255,255,calc((.8 + .2 * var(--hv)) * (1 - var(--dm))));box-sizing:border-box;border:1.5px solid rgba(0,0,0,calc(1 - .8 * var(--dm)));backface-visibility:hidden;pointer-events:none;will-change:transform,opacity}
.iso-layer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.iso-ui .iso-in{background:rgba(255,255,255,calc(1 - var(--dm)))}
/* on hover, the other layers keep only their outline */
.iso-in > :not(.iso-a){opacity:calc(1 - var(--dm))}
.iso-in.dim{border-style:dashed;border-color:rgba(0,0,0,calc(1 - .68 * var(--dm)))}
.iso-ui img{position:absolute;inset:0;width:100%;height:100%;display:block}
.no-js .iso-layer{transform:translateZ(calc(var(--i) * 44px))}
.iso-a{position:absolute;left:0;top:0;width:1px;height:1px}
.iso-b{top:100%}
.iso-tags{position:absolute;inset:0;pointer-events:none;z-index:3}
/* the hovered layer's label: a small badge hanging under the plate's front corner, never near the title */
.iso-tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--ink);color:var(--paper);font:500 11px/1 var(--mono);letter-spacing:.08em;white-space:nowrap;opacity:0;will-change:transform,opacity;pointer-events:none}
.iso-tag em{font-style:normal}
.iso-tag b{font-weight:700;color:var(--signal)}
.iso-tag i{position:absolute;left:50%;bottom:100%;width:1.5px;height:16px;margin-left:-.75px;background:var(--ink)}
.no-js .iso-tags{display:none}
.iso-layer{pointer-events:auto}
@media (hover:none){.iso-tag{pointer-events:none}}
.iso-axis{position:absolute;width:0;height:var(--axis,0px);border-left:1.5px dashed rgba(0,0,0,.32);transform-origin:0 0;transform:rotateX(90deg)}
.iso .gcol{fill:var(--signal);opacity:.10}
.iso .gbl{stroke:var(--signal);stroke-width:calc(var(--sw) * .6);opacity:.35}
.iso .ln{fill:none;stroke:var(--ink);stroke-width:var(--sw)}
.iso .tb{fill:#CFCFCB}
.iso .acc{fill:var(--signal)}
.iso .fab{fill:var(--ink)}
.iso .gl{stroke:#BDBDB9;stroke-width:var(--sw);stroke-dasharray:8 10}
.iso .area{fill:var(--signal);opacity:.12}
.iso .dl{fill:none;stroke:var(--signal);stroke-width:calc(var(--sw) * 1.6);stroke-linejoin:round}
.iso .pt{fill:#fff;stroke:var(--signal);stroke-width:var(--sw)}
.iso .db{fill:var(--signal)}
.iso{width:100%;height:clamp(230px,42vh,440px);margin-top:clamp(20px,4.5vh,48px)}
.iso-scene{left:50%;top:50%;width:min(60%,calc(42vh * .9),400px)}
@media (max-width:700px){.iso{height:clamp(210px,62vw,320px)}.iso-scene{width:68%;top:44%}.iso-tags{display:none}}

.cs-h{margin-top:clamp(8px,2vh,24px);font:800 clamp(42px,6vw,84px)/.88 var(--display);letter-spacing:-.05em;text-transform:uppercase;text-wrap:balance}
.dot{display:inline-block;width:.17em;height:.17em;margin-left:.05em;background:var(--signal);overflow:hidden;text-indent:-9em;vertical-align:baseline}
.cs-lead{margin-top:clamp(16px,2.6vh,28px);max-width:34ch;font:400 clamp(18px,1.6vw,22px)/1.4 var(--text);letter-spacing:-.01em;color:#1A1A1A;text-wrap:pretty}
.cs-mail{margin-top:clamp(24px,4vh,40px);display:inline-flex;align-items:center;gap:14px;height:52px;padding:0 22px;background:var(--ink);color:var(--paper);font:700 13px/1 var(--mono);letter-spacing:.04em;transition:background-color .15s,color .15s}
.cs-mail:hover{background:var(--signal);color:var(--ink)}
.cs-mail svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.cs-mail{min-width:228px;justify-content:center;padding:0 16px;gap:10px}
.cs-mail .i-ok,.cs-mail .i-copy{display:none}
.cs-mail.mail .i-copy{display:block}
.cs-mail.done .i-copy{display:none}
#copy-txt{display:inline-block}
#copy-txt.swap{animation:csSwap .35s cubic-bezier(.2,.7,.2,1)}
@keyframes csSwap{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:none}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cs-mail .i-ok{display:none}
.cs-mail.done{background:var(--signal);color:var(--ink)}
.cs-mail.done .i-ok{display:block}
.cs-note{margin-top:12px;min-height:1.4em;font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
footer{width:100%;display:flex;justify-content:center;padding:0 0 clamp(20px,3vh,32px);font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* entrance */
.js .rv{opacity:0;transform:translateY(12px)}
.ready .rv{opacity:1;transform:none;transition:opacity .7s,transform .9s var(--ease);transition-delay:calc(.15s + var(--d,0) * .1s)}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none}.ready .rv{transition:none}}
@media (max-width:560px){.cs-mail{width:100%;justify-content:center}}
@media (max-height:820px) and (min-width:701px){.iso{height:37vh;margin-top:3vh}.iso-scene{width:min(60%,calc(37vh * .9),400px)}.cs-lead{margin-top:14px}.cs-mail{margin-top:22px}}
</style>
</head>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const hasIO = 'IntersectionObserver' in window;
  requestAnimationFrame(() => document.documentElement.classList.add('ready'));

  /* ---------- hero: exploded isometric view ---------- */
  // intro: the layers lift off one by one. Hover a layer (or its label): it slides left, the others step back, its note appears.
  const iso = $('.iso');
  if (iso) {
    const scene = $('.iso-scene', iso);
    const layers = $$('.iso-layer', scene), plates = layers.map(l => $('.iso-in', l)), anchors = layers.map(l => $('.iso-b', l));
    const tags = $$('.iso-tag', iso);
    const N = layers.length;
    const clamp = v => Math.max(0, Math.min(1, v));
    const outCubic = t => 1 - Math.pow(1 - t, 3);
    const inOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // slow start, slow end
    let p = reduce ? 1 : 0;                    // intro progress 0 → 1
    let raf = 0, introOn = false, t0 = 0, hov = -1, last = 0, hovT = 0, want = -1;
    const h = layers.map(() => 0);             // per-layer hover amount, eased
    const INTRO = 2100, STAGGER = 0.1, FLOAT = !reduce;
    const sizes = () => iso.style.setProperty('--sw', (1.3 * 2000 / (scene.offsetWidth || 1)).toFixed(2));
    const render = () => {
      const r = iso.getBoundingClientRect();
      const fold = clamp((innerHeight * 0.15 - r.top) / (r.height * 0.9));   // close the stack as it scrolls away
      const W = scene.offsetWidth, G = W * 0.1 * (1 - 0.85 * fold), D = W * 0.1;   // D: how far the hovered plate slides out
      const any = Math.max(...h);
      let top = 0;
      layers.forEach((l, i) => {
        // top layers lift off first, so the stack never crosses itself; 1px floor avoids z-fighting
        const e = inOut(clamp((p - (N - 1 - i) * STAGGER) / (1 - (N - 1) * STAGGER)));
        // levitate: once the stack is open, every layer drifts a few pixels, out of phase with its neighbours
        const lev = FLOAT ? Math.sin(performance.now() / 1000 * 1.15 + i * 1.1) * W * 0.013 * e : 0;
        const z = i * (1 + (G - 1) * e) + lev;
        if (i === N - 1) top = z;
        l.style.transform = `translate3d(0,0,${z.toFixed(2)}px)`;
        // local (-k,-k) is straight left on screen in this projection
        const k = -0.7071 * D * h[i];   // starts moving at once, then settles (ease-out)
        plates[i].style.transform = `translate3d(${k.toFixed(2)}px,${k.toFixed(2)}px,0)`;
        // the others step back: grey and faint, so only the hovered plate reads
        const d = Math.max(0, any - h[i]);
        plates[i].style.setProperty('--dm', d.toFixed(3));
        plates[i].classList.toggle('dim', d > 0.5);   // dashed only once it has mostly faded, so the switch never pops
        plates[i].style.setProperty('--hv', h[i].toFixed(3));
        tags[i].dataset.e = e;
      });
      scene.style.setProperty('--axis', top.toFixed(2) + 'px');
      // flat labels, hanging under each plate's front corner
      tags.forEach((t, i) => {
        const a = anchors[i].getBoundingClientRect();
        const x = a.left - r.left, y = a.top - r.top;
        const e = +t.dataset.e;
        // only the hovered layer shows its label
        t.style.opacity = (clamp((e - 0.6) / 0.4) * (1 - clamp((fold - 0.35) / 0.3)) * outCubic(h[i])).toFixed(3);
        t.style.transform = `translate3d(${(x - t.offsetWidth / 2).toFixed(1)}px,${(y + 16).toFixed(1)}px,0)`;
      });
    };
    const tick = now => {
      raf = 0;
      if (introOn) { p = clamp((now - t0) / INTRO); if (p >= 1) introOn = false; }
      let moving = false;
      const dt = last ? Math.min(64, now - last) : 16; last = now;
      const f = 1 - Math.exp(-dt / 130);   // time-based easing: ~0.5 s to settle, same on every screen
      h.forEach((v, i) => { const t = i === hov ? 1 : 0; h[i] = v + (t - v) * f; if (Math.abs(t - h[i]) < 0.002) h[i] = t; else moving = true; });
      render();
      if (introOn || moving || FLOAT) raf = requestAnimationFrame(tick); else last = 0;
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };
    // a short delay before switching, so crossing from one plate to the next never flickers
    const setHov = i => {
      if (i === want) return;                  // pointermove fires constantly: only a change of plate restarts the timer
      want = i; clearTimeout(hovT);
      if (hov === -1 && i !== -1) applyHov(i);  // first plate: respond at once
      else hovT = setTimeout(() => applyHov(i), i === -1 ? 120 : 45);
    };
    const applyHov = i => {
      if (p < 1) { want = -2; return; }        // wait for the intro to finish (and let the next move try again)
      if (i === hov) return;
      hov = i;
      tags.forEach((t, k) => t.classList.toggle('on', k === i));
      kick();
    };
    sizes(); render();
    if ('ResizeObserver' in window) new ResizeObserver(() => { sizes(); kick(); }).observe(iso);
    addEventListener('scroll', kick, { passive: true });
    const go = () => {
      iso.classList.add('on');
      if (reduce) { p = 1; render(); return; }
      t0 = performance.now(); introOn = true; kick();
    };
    // the title finishes at ~0.6 s: the plan starts just before, so the two overlap
    const start = go;
    if (fine) {
      iso.addEventListener('pointermove', e => {
        const el = e.target.closest('.iso-layer');
        setHov(el ? layers.indexOf(el) : -1);
      });
      iso.addEventListener('pointerleave', () => setHov(-1));
    }
    if (hasIO) {
      let started = false;
      new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting && !started) { started = true; start(); } }), { threshold: 0.2 }).observe(iso);
    } else start();
  }


  /* "Contact me": hovering shows the address, a click copies it (no clipboard → the mail app opens) */
  const btn = $('#copy'), txt = $('#copy-txt'), status = $('#copy-status');
  if (btn) {
    const mail = btn.dataset.email, BASE = 'CONTACT ME';
    let state = 'base', tm = 0;
    const show = (t, st) => {
      if (state === st) return;
      state = st; txt.textContent = t;
      btn.classList.toggle('mail', st === 'mail');
      txt.classList.remove('swap'); void txt.offsetWidth; txt.classList.add('swap');
    };
    const legacy = v => { const a = document.createElement('textarea'); a.value = v; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} a.remove(); return ok; };
    btn.addEventListener('mouseenter', () => { if (state !== 'ok') show(mail, 'mail'); });
    btn.addEventListener('focus', () => { if (state !== 'ok') show(mail, 'mail'); });
    btn.addEventListener('mouseleave', () => { if (state !== 'ok') show(BASE, 'base'); });
    btn.addEventListener('blur', () => { if (state !== 'ok') show(BASE, 'base'); });
    btn.addEventListener('click', async () => {
      let ok = false;
      try { await navigator.clipboard.writeText(mail); ok = true; } catch (_) { ok = legacy(mail); }
      if (!ok) { location.href = 'mailto:' + mail; return; }
      btn.classList.add('done'); show('COPIED TO CLIPBOARD', 'ok'); status.textContent = 'Email copied: ' + mail;
      clearTimeout(tm);
      tm = setTimeout(() => { btn.classList.remove('done'); state = ''; const h = btn.matches(':hover'); show(h ? mail : BASE, h ? 'mail' : 'base'); }, 1800);
    });
  }
})();
</script>
